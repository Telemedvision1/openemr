# Use admin/pass as user/password credentials to login to tabemr (from OE_USER and OE_PASS below)
# MYSQL_HOST and MYSQL_ROOT_PASS are required for tabemr
# MYSQL_USER, MYSQL_PASS, OE_USER, OE_PASS are optional for tabemr and
#   if not provided, then default to tabemr, tabemr, admin, and pass respectively.
services:
  mysql:
    restart: always
    image: mariadb:11.8.8@sha256:be1ef4fe5f14589325c08a41c76334097ce66c86264b75e1d28342c742782a61
    command: ['mariadbd', '--character-set-server=utf8mb4']
    volumes:
    - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/healthcheck.sh
      - --su-mysql
      - --connect
      - --innodb_initialized
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 3
  tabemr:
    restart: always
    image: tabemr/tabemr:latest@sha256:632e6c43c59b77fa4aa295d8c1cdd462f006a55be5aac35775cc9aec58e18d89
    ports:
    - 8080:80
    - 8443:443
    volumes:
    - logvolume01:/var/log
    - sitevolume:/var/www/localhost/htdocs/tabemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: tabemr
      MYSQL_PASS: tabemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      start_period: 3m
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  logvolume01: {}
  sitevolume: {}
  databasevolume: {}
